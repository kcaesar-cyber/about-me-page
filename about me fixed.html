<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Gabriella</title>
<style>
  body { font-family: Georgia, serif; background: #FDF6F8; color: #4A2E39; margin: 0; line-height: 1.6; }
  header { background: #C9738E; color: white; padding: 48px 24px; text-align: center; }
  h1 { margin: 0 0 8px 0; font-size: 2.5rem; letter-spacing: 1px; }
  nav { background: #4A2E39; padding: 16px; text-align: center; }
  nav a { color: #FDF6F8; margin: 0 16px; text-decoration: none; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
  .card-container { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 24px; }
  .card { background: white; border: 1px solid #E8D9DE; border-radius: 8px; padding: 24px; flex: 1; min-width: 280px; }
  #hobbies { border-left: 4px solid #C9738E; padding-left: 16px; }
  #goals { background: white; padding: 24px; border-radius: 8px; margin-top: 32px; }
  img { width: 100%; max-width: 400px; height: 300px; object-fit: cover; border-radius: 8px; }
  footer { background: #4A2E39; color: #E8D9DE; text-align: center; padding: 24px; margin-top: 48px; }

  @media (max-width: 768px) {
    h1 { font-size: 2rem; }
    .card-container { flex-direction: column; }
    main { padding: 24px 16px; }
  }
  @media (min-width: 1200px) {
    main { max-width: 1100px; }
    h1 { font-size: 3rem; }
  }
</style>
</head>
<body>
<header>
<h1>About Gabriella</h1>
<p>Hi, I'm Gabriella from New York.</p>
</header>
<nav>
<a href="#hobbies">Hobbies</a>
<a href="#goals">Goals</a>
</nav>
<main>
<section id="hobbies">
<h2>Hobbies</h2>
<h3>Things I Like</h3>
<div class="card-container">
<div class="card">
<ul>
<li>Music</li>
<li>Coffee</li>
<li>Fashion</li>
</ul>
</div>
<div class="card">
<img src="photo.jpg" alt="Gabriella smiling in a cafe on a sunny day">
</div>
</div>
</section>
<section id="goals">
<h2>Goals</h2>
<p>Finish my web development class.</p>
</section>
</main>
<footer>
<p>2026 Gabriella Caesar</p>
</footer>
</body>
</html>
